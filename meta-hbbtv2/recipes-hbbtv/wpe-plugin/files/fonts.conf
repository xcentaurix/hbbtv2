<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/wpe-fontconfig-cache</cachedir>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Tiresias</family><prefer><family>Liberation Sans</family><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Andale Mono</family></prefer></alias>
</fontconfig>
