<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>vid=loading</title>
<style>html,body{margin:0;background:transparent;color:#fff;font:22px monospace}
#frame{position:absolute;left:36px;top:36px;width:648px;height:368px;border:4px solid #f00;background:rgba(255,0,0,.15)}
video{position:absolute;left:40px;top:40px;width:640px;height:360px}
#s{position:absolute;left:40px;top:430px;width:1180px;white-space:pre;background:rgba(0,0,0,.65);padding:8px}
#tag{position:absolute;left:720px;top:40px;width:500px;background:rgba(0,0,90,.8);padding:12px;border:3px solid #fff}</style></head>
<body>
<div id="frame"></div>
<video id="v" playsinline></video>
<div id="tag">HW video test 3 (with sound)<br>sequence: play - seek back to 1s at 3s - pause at 5s for 2s - resume - play to the end.<br>The red frame marks the &lt;video&gt; box.</div>
<div id="s"></div>
<script>
var src = 'https://www.w3schools.com/html/mov_bbb.mp4';
var v = document.getElementById('v'), s = document.getElementById('s'), log = [], t0 = performance.now(), step = 0, ended = false;
function note(m) { log.push(((performance.now() - t0) / 1000).toFixed(1) + 's ' + m); if (log.length > 9) log.shift(); }
['loadedmetadata','canplay','playing','pause','waiting','seeking','seeked','ended','error'].forEach(function (n) {
  v.addEventListener(n, function () { note('event ' + n + ' t=' + v.currentTime.toFixed(2)); if (n === 'ended') ended = true; });
});
v.src = src;
v.play().catch(function (e) { note('play() rejected: ' + e.name); });
function tick() {
  var t = v.currentTime;
  if (step === 0 && t >= 3) { step = 1; note('ACTION seek to 1.0'); v.currentTime = 1; }
  else if (step === 1 && t >= 5) { step = 2; note('ACTION pause'); v.pause(); setTimeout(function () { note('ACTION play'); step = 3; v.play(); }, 2000); }
  var line = 't=' + t.toFixed(2) + '/' + (isFinite(v.duration) ? v.duration.toFixed(1) : '?') + ' rs=' + v.readyState + ' ' + v.videoWidth + 'x' + v.videoHeight +
    ' paused=' + v.paused + ' ended=' + ended + ' err=' + (v.error ? v.error.code + ':' + v.error.message : '-') + ' step=' + step;
  s.textContent = line + '\n' + log.join('\n');
  document.title = 'vid=' + line;
}
setInterval(tick, 400);
</script></body></html>
