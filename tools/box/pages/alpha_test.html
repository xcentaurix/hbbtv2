<!doctype html><meta charset="utf-8"><title>alpha</title>
<body style="margin:0;background:transparent;overflow:hidden;font-family:sans-serif">
<!-- ALPHA TEST: fully transparent page background, panels with known alpha. Video underneath should show through. -->
<style>
  .p { position:absolute; top:190px; width:220px; height:300px; box-sizing:border-box; border:4px solid #fff; border-radius:10px; }
  .l { position:absolute; top:500px; width:220px; text-align:center; color:#fff; font-size:22px; text-shadow:0 0 4px #000, 0 0 8px #000; }
  #title { position:absolute; left:0; right:0; top:60px; text-align:center; color:#fff; font-size:44px; text-shadow:0 0 6px #000, 0 0 12px #000; }
  #fade { position:absolute; left:60px; top:590px; width:1160px; height:50px; border:2px solid #fff;
          background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,1)); }
</style>
<div id="title">ALPHA TEST - video should show through</div>
<div class="p" style="left:60px;  background:transparent"></div>
<div class="p" style="left:290px; background:rgba(0,0,0,0.5)"></div>
<div class="p" style="left:520px; background:rgba(255,0,0,0.5)"></div>
<div class="p" style="left:750px; background:rgba(255,255,255,0.5)"></div>
<div class="p" style="left:980px; background:rgba(0,0,255,1)"></div>
<div class="l" style="left:60px">0% (clear)</div>
<div class="l" style="left:290px">black 50%</div>
<div class="l" style="left:520px">red 50%</div>
<div class="l" style="left:750px">white 50%</div>
<div class="l" style="left:980px">blue 100%</div>
<div id="fade"></div>
<div class="l" style="left:60px; width:1160px; top:648px">fade: transparent (left) to opaque black (right)</div>
<script>
// a little motion so the damage path is exercised too
let n = 0, last = performance.now();
function f(t) { n++; if (t - last >= 1000) { document.title = 'fps=' + (n * 1000 / (t - last)).toFixed(1) + ' maxdt=0ms'; n = 0; last = t; } requestAnimationFrame(f); }
requestAnimationFrame(f);
</script>
