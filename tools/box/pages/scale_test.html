<!DOCTYPE html><html><head><meta charset="utf-8"><title>scale test</title>
<style>html,body{margin:0;width:1280px;height:720px;background:#102030;color:#fff;font:16px sans-serif;overflow:hidden}
#a{position:absolute;left:40px;top:30px;font-size:44px;font-weight:bold}
#b{position:absolute;left:40px;top:100px;width:520px;line-height:1.35}
#c{position:absolute;left:640px;top:100px;width:560px;height:300px;background:rgba(255,255,255,.35);border:2px solid #fff}
#d{position:absolute;left:40px;top:420px;width:1200px;height:1px;background:#fff}
#e{position:absolute;left:40px;top:440px;width:2px;height:200px;background:#f80}
.g{position:absolute;left:100px;top:440px;width:300px;height:200px;background:repeating-linear-gradient(90deg,#fff 0 1px,#000 1px 2px)}
#f{position:absolute;left:640px;top:440px;font-size:12px}</style></head><body>
<div id="a">ZDFmediathek HbbTV 1280x720</div>
<div id="b">The quick brown fox jumps over the lazy dog. Small text at 16 px shows how well the scaling keeps letters readable: Zustimmung, Einstellungen, Ablehnen, Jetzt ansehen.</div>
<div id="c"></div><div id="d"></div><div id="e"></div><div class="g"></div>
<div id="f">12 px text on the right: 0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
</body></html>
